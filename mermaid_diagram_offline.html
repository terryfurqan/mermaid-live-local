<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Strict Air-Gapped Content Security Policy: Memblokir 100% koneksi jaringan keluar (connect-src 'none') & resource eksternal -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; object-src 'none'; frame-src 'none'; child-src 'none'; worker-src 'none'; form-action 'none'; base-uri 'self';">
<title>Mermaid Live Editor — 100% Offline (Air-Gapped)</title>
<link rel="stylesheet" href="./assets/css/fontawesome.min.css">
<script src="./assets/js/mermaid.min.js"></script>
<script src="./assets/js/svg-pan-zoom.min.js"></script>
<script src="./assets/js/pako.min.js"></script>
<style>
  :root {
    --bg-app: #141417;
    --bg-header: #1c1c21;
    --bg-panel: #1e1e24;
    --bg-editor: #18181c;
    --bg-gutter: #141418;
    --bg-canvas: #1b1b1f;
    --border: #2e2e38;
    --text-main: #e6e6ef;
    --text-muted: #8b8b9e;
    --accent: #ff3670;
    --accent-hover: #ff5286;
    --accent-soft: rgba(255, 54, 112, 0.14);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg-app);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    font-size: 13px;
  }

  /* Top Navbar */
  #topbar {
    height: 48px;
    background: var(--bg-header);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px;
    user-select: none;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 600;
    font-size: 14px;
    color: #fff;
    white-space: nowrap;
  }
  .brand-logo {
    width: 26px;
    height: 26px;
    border-radius: 6px;
    background: linear-gradient(135deg, #ff3670, #ff7a45);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 13px;
    flex-shrink: 0;
  }
  .airgap-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 500;
    padding: 2px 8px;
    border-radius: 99px;
    background: rgba(46, 204, 113, 0.12);
    color: #2ecc71;
    border: 1px solid rgba(46, 204, 113, 0.35);
    white-space: nowrap;
  }

  .top-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .ctrl-group {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #25252d;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 3px 8px;
    white-space: nowrap;
  }
  .ctrl-group label {
    color: var(--text-muted);
    font-size: 11px;
  }
  select, .btn {
    background: #25252d;
    color: var(--text-main);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 12px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    transition: background 0.15s, border-color 0.15s;
  }
  .ctrl-group select {
    border: none;
    padding: 2px 4px;
    background: transparent;
    outline: none;
  }
  .btn:hover, select:hover { background: #30303b; }
  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 500;
  }
  .btn-primary:hover { background: var(--accent-hover); }

  /* Workspace Split Layout */
  #workspace {
    display: flex;
    width: 100vw;
    height: calc(100vh - 48px);
    overflow: hidden;
  }

  /* Left Editor Pane */
  #left-pane {
    width: 440px;
    min-width: 240px;
    max-width: 75vw;
    height: 100%;
    background: var(--bg-panel);
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
  }

  .pane-tabs {
    height: 38px;
    background: #19191f;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 10px;
    user-select: none;
  }
  .tab-list {
    display: flex;
    align-items: center;
    gap: 4px;
    height: 100%;
  }
  .tab-btn {
    background: transparent;
    border: none;
    color: var(--text-muted);
    height: 100%;
    padding: 0 12px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .tab-btn:hover { color: var(--text-main); }
  .tab-btn.active {
    color: #fff;
    border-bottom-color: var(--accent);
  }

  .sync-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--text-muted);
    cursor: pointer;
  }
  .sync-toggle input { accent-color: var(--accent); cursor: pointer; }

  /* Code Editor with Line Numbers */
  .editor-wrap {
    position: relative;
    flex: 1;
    display: flex;
    overflow: hidden;
    background: var(--bg-editor);
  }
  .line-numbers {
    width: 44px;
    padding: 14px 8px 14px 0;
    background: var(--bg-gutter);
    border-right: 1px solid #23232b;
    color: #58586a;
    font-family: "JetBrains Mono", "Fira Code", "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
    line-height: 20px;
    text-align: right;
    user-select: none;
    overflow: hidden;
    flex-shrink: 0;
  }
  .line-numbers > div {
    min-height: 20px;
  }
  .code-textarea {
    flex: 1;
    width: 100%;
    height: 100%;
    border: none;
    outline: none;
    resize: none;
    padding: 14px 14px;
    background: transparent;
    color: #f1f1f7;
    font-family: "JetBrains Mono", "Fira Code", "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
    line-height: 20px;
    tab-size: 2;
    white-space: pre-wrap;
    overflow-wrap: break-word;
    word-break: break-word;
    overflow-x: hidden;
    overflow-y: auto;
  }

  /* Error Box */
  #error-banner {
    display: none;
    background: #2d161b;
    border-top: 1px solid #6b2331;
    color: #ff9da7;
    padding: 10px 12px;
    font-family: "JetBrains Mono", Menlo, monospace;
    font-size: 11.5px;
    line-height: 1.45;
    max-height: 140px;
    overflow: auto;
    white-space: pre-wrap;
  }
  #error-banner.visible { display: block; }

  /* Status Footer inside Left Pane */
  .editor-footer {
    height: 28px;
    background: #16161b;
    border-top: 1px solid var(--border);
    padding: 0 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
    color: var(--text-muted);
    user-select: none;
  }
  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #2ecc71;
    display: inline-block;
    margin-right: 5px;
  }
  .status-dot.err { background: #ff4757; }

  /* Draggable Splitter */
  #splitter {
    width: 5px;
    cursor: col-resize;
    background: #19191f;
    transition: background 0.15s;
    position: relative;
    z-index: 5;
  }
  #splitter:hover, #splitter.dragging {
    background: var(--accent);
  }

  /* Right Preview Canvas */
  #right-pane {
    flex: 1;
    height: 100%;
    position: relative;
    overflow: hidden;
    background-color: var(--bg-canvas);
  }
  #right-pane.grid-on {
    background-image:
      linear-gradient(to right, rgba(255,255,255,0.06) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,0.06) 1px, transparent 1px);
    background-size: 20px 20px;
  }
  #right-pane.light-canvas {
    background-color: #f8f9fb;
  }
  #right-pane.light-canvas.grid-on {
    background-image:
      linear-gradient(to right, rgba(0,0,0,0.07) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(0,0,0,0.07) 1px, transparent 1px);
  }

  #container {
    width: 100%;
    height: 100%;
  }
  #container svg {
    width: 100% !important;
    height: 100% !important;
    max-width: none !important;
  }

  /* Floating Canvas Controls */
  #canvas-controls {
    position: absolute;
    right: 16px;
    bottom: 16px;
    display: flex;
    align-items: center;
    gap: 4px;
    background: rgba(30, 30, 36, 0.92);
    backdrop-filter: blur(8px);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 4px;
    z-index: 10;
    box-shadow: 0 6px 20px rgba(0,0,0,0.35);
  }
  .icon-btn {
    width: 32px;
    height: 32px;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: var(--text-main);
    font-size: 13px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .icon-btn:hover { background: #32323d; }
  .icon-btn.active {
    background: var(--accent-soft);
    color: #ff6996;
  }
  .zoom-readout {
    min-width: 46px;
    text-align: center;
    font-size: 11.5px;
    color: var(--text-muted);
    user-select: none;
  }
  .divider-v {
    width: 1px;
    height: 18px;
    background: var(--border);
    margin: 0 2px;
  }

  /* Toast Notification */
  #toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #282832;
    color: #fff;
    border: 1px solid #3e3e4d;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 12px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    z-index: 100;
  }
  #toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .file-badge-wrap {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: #23232b;
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 2px 7px;
    font-size: 11.5px;
    color: var(--text-muted);
  }
  .file-badge-wrap input {
    background: transparent;
    border: none;
    outline: none;
    color: var(--text-main);
    font-family: "JetBrains Mono", Menlo, monospace;
    font-size: 11.5px;
    width: 125px;
  }
  .file-badge-wrap input:focus {
    color: #fff;
  }
  body.drag-over::after {
    content: "Lepaskan file .mmd untuk membuka diagram";
    position: fixed;
    inset: 0;
    background: rgba(20, 20, 23, 0.82);
    border: 2px dashed var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 600;
    color: #fff;
    z-index: 200;
    pointer-events: none;
  }

  /* Safety Lock Housing for External mermaid.live Button */
  .safety-group {
    display: inline-flex;
    align-items: center;
    background: #1f1f26;
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 2px;
    gap: 2px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .safety-group.armed {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(255, 54, 112, 0.2);
  }
  .safety-switch {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 8px;
    font-size: 11px;
    color: var(--text-muted);
    cursor: pointer;
    border-radius: 5px;
    user-select: none;
  }
  .safety-switch:hover {
    background: #2a2a34;
    color: var(--text-main);
  }
  .safety-group.armed .safety-switch {
    color: #ff6996;
  }
  .safety-switch input {
    accent-color: var(--accent);
    cursor: pointer;
    margin: 0;
  }
  #btn-open-live {
    border-radius: 5px;
    padding: 4px 10px;
  }
  #btn-open-live:disabled {
    background: #26262f;
    border-color: transparent;
    color: #6c6c7e;
    cursor: not-allowed;
    opacity: 0.55;
  }

  /* Left Quick Tool Sidebar (Bentuk Node + Warna Node + Warna Garis) */
  #color-sidebar {
    width: 154px;
    flex-shrink: 0;
    height: 100%;
    background: #141418;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 6px 6px;
    gap: 4px;
    user-select: none;
    overflow-y: auto;
  }
  .color-sidebar-title {
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.6px;
    color: var(--text-muted);
    text-align: center;
    text-transform: uppercase;
    margin-top: 1px;
  }
  .target-node-box {
    background: #1e1e26;
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 3px 5px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 4px;
  }
  .target-node-box label {
    font-size: 9.5px;
    color: var(--text-muted);
    white-space: nowrap;
  }
  .target-node-box select {
    flex: 1;
    min-width: 0;
    padding: 2px 3px;
    font-family: "JetBrains Mono", Menlo, monospace;
    font-size: 11px;
    font-weight: 600;
    color: #fff;
    background: #141418;
    border: 1px solid #343442;
    border-radius: 4px;
  }

  /* Segmented Mini Toggles untuk Mode Tambah Node & Penamaan */
  .node-mode-bar {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 2px;
    background: #1a1a22;
    padding: 2px;
    border-radius: 5px;
    border: 1px solid #2b2b38;
  }
  .node-mode-bar.two-col {
    grid-template-columns: repeat(2, 1fr);
  }
  .node-mode-btn {
    background: transparent;
    border: none;
    border-radius: 3px;
    color: var(--text-muted);
    font-size: 9.5px;
    font-weight: 600;
    padding: 2px 2px;
    cursor: pointer;
    transition: background 0.12s, color 0.12s;
    white-space: nowrap;
  }
  .node-mode-btn:hover {
    color: #fff;
  }
  .node-mode-btn.active {
    background: var(--accent);
    color: #fff;
  }

  /* Grid 15 Tombol Bentuk Flowchart */
  .shape-preset-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 3px;
  }
  .shape-btn {
    height: 23px;
    background: #1e1e26;
    border: 1px solid #343442;
    border-radius: 4px;
    color: #e2e2ee;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2.5px;
    padding: 0 2px;
    font-family: "JetBrains Mono", Menlo, monospace;
    font-size: 8.5px;
    font-weight: 600;
    letter-spacing: -0.3px;
    white-space: nowrap;
    overflow: hidden;
    transition: transform 0.1s, border-color 0.15s, background 0.15s;
  }
  .shape-btn svg {
    width: 14px;
    height: 12px;
    flex-shrink: 0;
    stroke: #f1f1f7;
    stroke-width: 1.8;
    fill: rgba(255, 54, 112, 0.14);
  }
  .shape-btn:hover {
    border-color: var(--accent);
    background: #262633;
    color: #fff;
    transform: scale(1.04);
  }
  .shape-btn:active {
    transform: scale(0.96);
  }

  /* Grid 6 Kolom Kotak Warna Node (42 Warna) */
  .color-preset-list {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 3px;
    flex: none;
  }
  .node-swatch {
    height: 15px;
    border: 1px solid rgba(255, 255, 255, 0.78);
    border-radius: 3px;
    cursor: pointer;
    padding: 0;
    box-shadow: 0 1px 2px rgba(0,0,0,0.35);
    transition: transform 0.1s, filter 0.15s, border-color 0.15s;
  }
  .node-swatch:hover {
    transform: scale(1.16);
    filter: brightness(1.15);
    border-color: #ffffff;
    z-index: 2;
  }
  .node-swatch:active {
    transform: scale(0.95);
  }
  .swatch-action-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 3px;
  }
  .swatch-action-btn {
    height: 20px;
    background: #141418;
    border: 1px dashed #6b6b7e;
    border-radius: 4px;
    color: #c7c7d6;
    font-size: 9.5px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
    padding: 0 2px;
    position: relative;
    overflow: hidden;
  }
  .swatch-action-btn:hover {
    border-color: #fff;
    color: #fff;
  }
  .swatch-action-btn input[type="color"] {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    cursor: pointer;
    border: 0;
    padding: 0;
  }

  /* Warna & Gaya Garis (edge) — berbasis Edge ID, bukan nomor linkStyle */
  .sidebar-divider {
    height: 1px;
    background: var(--border);
    margin: 2px 0 1px;
  }
  .line-swatch-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 3px;
  }
  .line-swatch {
    height: 15px;
    border: 1px solid #2e2e3a;
    border-radius: 3px;
    background: #1b1b22;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    transition: transform 0.1s, border-color 0.15s;
  }
  .line-swatch::before {
    content: '';
    display: block;
    width: 76%;
    height: 3.5px;
    border-radius: 2px;
    background: var(--sw);
  }
  .line-swatch:hover { transform: scale(1.16); border-color: #fff; z-index: 2; }
  .line-swatch:active { transform: scale(0.95); }
  .line-type-row {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 3px;
  }
  .line-type-btn {
    height: 20px;
    background: #1e1e26;
    border: 1px solid #343442;
    border-radius: 4px;
    color: #c7c7d6;
    font-family: "JetBrains Mono", Menlo, monospace;
    font-size: 9px;
    font-weight: 700;
    cursor: pointer;
    padding: 0;
  }
  .line-type-btn::before {
    content: '';
    display: block;
    width: 68%;
    margin: 0 auto;
    border-top: 2px solid #c7c7d6;
  }
  .line-type-btn[data-arrow="-.->"]::before { border-top-style: dotted; border-top-width: 3px; }
  .line-type-btn[data-arrow="==>"]::before { border-top-width: 4.5px; }
  .line-type-btn[data-arrow="---"]::before { border-top-width: 1.5px; opacity: 0.75; }
  .line-type-btn[data-arrow="<-->"]::before { content: '↔'; border: none; width: auto; line-height: 1; font-size: 11px; }
  .line-type-btn:hover { border-color: #fff; color: #fff; }
  .line-type-btn:hover::before { border-top-color: #fff; }

  /* Area of Interest (AOI) Export Overlay & Toolbar */
  #aoi-toolbar {
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    display: none;
    align-items: center;
    gap: 5px;
    background: rgba(22, 22, 28, 0.96);
    backdrop-filter: blur(10px);
    border: 1px solid #3d3d4e;
    border-radius: 8px;
    padding: 4px 8px;
    z-index: 25;
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.55);
    user-select: none;
    white-space: nowrap;
  }
  #aoi-toolbar.visible {
    display: flex;
  }
  .aoi-title {
    font-size: 11px;
    font-weight: 700;
    color: #ff6996;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding-right: 5px;
    border-right: 1px solid var(--border);
  }
  .aoi-field {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    background: #141418;
    border: 1px solid #2e2e3a;
    border-radius: 5px;
    padding: 2px 5px;
  }
  .aoi-field label {
    font-size: 10px;
    font-weight: 600;
    color: var(--text-muted);
    font-family: "JetBrains Mono", Menlo, monospace;
  }
  .aoi-field input[type="number"] {
    width: 46px;
    background: transparent;
    border: none;
    outline: none;
    color: #fff;
    font-family: "JetBrains Mono", Menlo, monospace;
    font-size: 11px;
    text-align: right;
  }
  .aoi-field select {
    background: transparent;
    border: none;
    outline: none;
    color: #fff;
    font-size: 11px;
    padding: 1px 2px;
    cursor: pointer;
  }
  .aoi-btn {
    background: #282834;
    color: var(--text-main);
    border: 1px solid #3a3a4a;
    border-radius: 5px;
    padding: 3px 7px;
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: background 0.15s, border-color 0.15s;
  }

  .aoi-handle {

    height: 10px;
    background: #fff;
    border: 2px solid #ff3670;
    border-radius: 2px;

  .aoi-handle.nw { top: -6px; left: -6px; cursor: nwse-resize; }

  const RESERVED_WORDS = new Set([
    'flowchart', 'graph', 'TD', 'TB', 'BT', 'RL', 'LR',
    'subgraph', 'end', 'direction', 'style', 'classDef', 'class', 'click', 'linkStyle',
    'sequenceDiagram', 'stateDiagram', 'stateDiagram-v2', 'classDiagram', 'erDiagram'
  ]);

  let lastCleanSvg = null;
  let lastDiagramBox = null;

  let isFirstRender = true;

  let nodeActionMode = 'link';   // 'link' (+Panah) | 'standalone' (+Node) | 'reshape' (Ubah)
  let nodeNamingMode = 'alpha';  // 'alpha' (A,B,C...) | 'branch' (A1,A2... / D1,D2...)

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(showToast._timer);
    showToast._timer = setTimeout(() => t.classList.remove('show'), 2200);
  }

  // Token panah flowchart: opsional "edgeId@" + panah (-->, ---, -.->, -.-, ==>, ===, --o, --x, <-->, ~~~)
  // juga opener/closer untuk panah ber-teks inline: "-- teks -->", "-. teks .->", "== teks ==>"
  const ARROW_TOKEN_RE = /(?:([A-Za-z_][\w-]*)@)?(<?(?:-\.+-[>xo]?|-{2,}[>xo]?|={2,}[>xo]?|~{3,}|\.-[>xo]?|-\.(?=\s)))/g;

  // Tokenize satu baris flowchart → { nodes: [{id, index}], edges: [{start, arrowStart, end, id, arrow, close, inlineText, src, dst}] }
  function tokenizeFlowLine(rawLine) {
    const empty = { nodes: [], edges: [] };
    const noComment = rawLine.replace(/%%.*$/, '');
    if (!noComment.trim()) return empty;

    // Check if it's a style line: style <NodeID> ...
    const styleMatch = noComment.match(/^\s*style\s+([A-Za-z0-9_-]+)\b/);
    if (styleMatch) {
      return { nodes: [{ id: styleMatch[1], index: noComment.indexOf(styleMatch[1]) }], edges: [] };
    }
    if (/^\s*(flowchart|graph|subgraph|end|direction|classDef|class|click|linkStyle)\b/.test(noComment)) {
      return empty;
    }

    // Mask out edge labels |...|, asymmetric node >...], nested [...], (...), {...}, and :::class
    let masked = noComment
      .replace(/\|[^|]*\|/g, m => ' '.repeat(m.length))
      .replace(/(?<=\b[A-Za-z_][A-Za-z0-9_]*)>[^\]]*\]/g, m => ' '.repeat(m.length));
    for (let pass = 0; pass < 3; pass++) {
      masked = masked
        .replace(/\[[^\[\]]*\]/g, m => ' '.repeat(m.length))
        .replace(/\([^()]*\)/g, m => ' '.repeat(m.length))
        .replace(/\{[^{}]*\}/g, m => ' '.repeat(m.length));
    }
    masked = masked.replace(/:::[A-Za-z0-9_-]+/g, m => ' '.repeat(m.length));

    // Cari token panah
    const rawTokens = [];
    ARROW_TOKEN_RE.lastIndex = 0;
    let t;
    while ((t = ARROW_TOKEN_RE.exec(masked)) !== null) {
      rawTokens.push({
        start: t.index,
        arrowStart: t.index + (t[1] ? t[1].length + 1 : 0),
        end: t.index + t[0].length,
        id: t[1] || null,
        arrow: t[2]
      });
    }

    // Gabungkan opener + closer menjadi satu edge ber-teks inline
    const edges = [];
    for (let i = 0; i < rawTokens.length; i++) {
      const tok = rawTokens[i];
      const bare = tok.arrow.replace(/^</, '');
      const next = rawTokens[i + 1];
      if (['--', '==', '-.'].includes(bare) && next && !next.id) {
        edges.push({
          start: tok.start, arrowStart: tok.arrowStart, end: next.end, id: tok.id,
          arrow: tok.arrow, close: next.arrow,
          inlineText: noComment.slice(tok.end, next.start).trim()
        });
        i++;
      } else {
        edges.push({ ...tok, close: tok.arrow, inlineText: null });
      }
    }

    // Kosongkan area panah (+ teks inline) dan sisa "id@" agar tidak terbaca sebagai node
    edges.forEach(e => {
      masked = masked.slice(0, e.start) + ' '.repeat(e.end - e.start) + masked.slice(e.end);
    });
    masked = masked.replace(/[A-Za-z_][\w-]*@/g, s => ' '.repeat(s.length));

    const nodes = [];
    const regex = /\b([A-Za-z_][A-Za-z0-9_-]*)\b/g;
    let m;
    while ((m = regex.exec(masked)) !== null) {
      if (!RESERVED_WORDS.has(m[1])) {
        nodes.push({ id: m[1], index: m.index });
      }
    }

    // Tentukan node asal (src) & tujuan (dst) tiap edge
    edges.forEach(e => {
      const before = nodes.filter(n => n.index < e.start);
      const after = nodes.find(n => n.index >= e.end);
      e.src = before.length ? before[before.length - 1].id : null;
      e.dst = after ? after.id : null;
    });

    return { nodes, edges };
  }

  // Extract node tokens [{id, index}] from a single line of Mermaid flowchart
  function extractNodesFromLine(rawLine) {
    return tokenizeFlowLine(rawLine).nodes;
  }

  function refreshNodeDropdown(preferredNode = null) {
    const allNodes = [];
    const seen = new Set();
    mermaidCode.split('\n').forEach(line => {
      extractNodesFromLine(line).forEach(item => {
        if (!seen.has(item.id)) {
          seen.add(item.id);
          allNodes.push(item.id);
        }
      });
    });

    const prev = preferredNode || currentTargetNode || targetNodeSelect.value;
    targetNodeSelect.innerHTML = '';
    allNodes.forEach(id => {
      const opt = document.createElement('option');
      opt.value = id;
      opt.textContent = id;
      targetNodeSelect.appendChild(opt);
    });

    if (prev && seen.has(prev)) {
      targetNodeSelect.value = prev;
      currentTargetNode = prev;
    } else if (allNodes.length > 0) {
      targetNodeSelect.value = allNodes[0];
      currentTargetNode = allNodes[0];
    }
  }

  targetNodeSelect.addEventListener('change', () => {
    currentTargetNode = targetNodeSelect.value;
  });

  // ===== Tambah Node Baru & Ubah Bentuk Node Flowchart =====
  function getAllUsedIds() {
    const used = new Set(RESERVED_WORDS);
    mermaidCode.split('\n').forEach(line => {
      extractNodesFromLine(line).forEach(n => used.add(n.id));
      tokenizeFlowLine(line).edges.forEach(e => { if (e.id) used.add(e.id); });
      const sg = line.match(/^\s*subgraph\s+([A-Za-z_][\w-]*)/);
      if (sg) used.add(sg[1]);
    });
    return used;
  }

  // Hasilkan ID node otomatis:
  // - mode 'alpha': A, B, C ... Z, lalu A1, A2, A3 ...
  // - mode 'branch': mengikuti huruf Node aktif → A1, A2, A3 ... atau D1, D2, D3 ...
  function getNextAutoNodeId(parentId, mode) {
    const used = getAllUsedIds();
    if (mode === 'branch' && parentId) {
      const prefix = (parentId.match(/^[A-Za-z]+/) || ['A'])[0];
      for (let n = 1; n <= 999; n++) {
        const cand = `${prefix}${n}`;
        if (!used.has(cand)) return cand;
      }
    }
    // Mode 'alpha': cari A..Z yang belum terpakai
    for (let c = 65; c <= 90; c++) {
      const letter = String.fromCharCode(c);
      if (!used.has(letter)) return letter;
    }
    // Jika A..Z penuh, lanjutkan A1, A2 ... atau mengikuti huruf parent
    const fallbackPrefix = (parentId && (parentId.match(/^[A-Za-z]+/) || [])[0]) || 'A';
    for (let n = 1; n <= 999; n++) {
      const cand = `${fallbackPrefix}${n}`;
      if (!used.has(cand)) return cand;
    }
    return `N${Date.now() % 1000}`;
  }

  // Cari baris tempat menyisipkan node/edge baru (sebelum blok style/classDef/class/linkStyle di bagian bawah)
  function findFlowInsertIndex(lines) {
    let idx = lines.length;
    while (idx > 0 && lines[idx - 1].trim() === '') idx--;
    while (idx > 0 && /^\s*(style|classDef|class|linkStyle)\b/.test(lines[idx - 1])) {
      idx--;
    }
    return idx;
  }

  // Regex untuk mencocokkan bentuk node yang menempel pada suatu Node ID (urut dari kurung terdalam/terpanjang)
  function buildNodeShapeRegex(nodeId) {
    const id = escRe(nodeId);
    return new RegExp(
      `(^|[^A-Za-z0-9_-])(${id})(?:` +
      `\\({3}([^()]*)\\){3}|` +
      `\\({2}([^()]*)\\){2}|` +
      `\\[\\(([^()]*)\\)\\]|` +
      `\\(\\[([^\\[\\]]*)\\]\\)|` +
      `\\[{2}([^\\[\\]]*)\\]{2}|` +
      `\\{{2}([^{}]*)\\}{2}|` +
      `\\[\\/([^\\[\\]]*)\\/\\]|` +
      `\\[\\\\([^\\[\\]]*)\\\\\\]|` +
      `\\[\\/([^\\[\\]]*)\\\\\\]|` +
      `\\[\\\\([^\\[\\]]*)\\/\\]|` +
      `>([^\\]]*)\\]|` +
      `\\[([^\\[\\]]*)\\]|` +
      `\\(([^()]*)\\)|` +
      `\\{([^{}]*)\\}` +
      `)`
    );
  }

  function handleShapeButtonClick(shape) {
    if (!isFlowchartCode()) {
      showToast('Tombol bentuk node khusus untuk diagram Flowchart');
      return;
    }
    refreshNodeDropdown();
    const parentId = targetNodeSelect.value || currentTargetNode;
    const lines = mermaidCode.split('\n');

    // Jika tombol Subgraph diklik
    if (shape.isSubgraph) {
      const used = getAllUsedIds();
      let sgNum = 1;
      while (used.has(`SG${sgNum}`)) sgNum++;
      const sgId = `SG${sgNum}`;
      const childId = getNextAutoNodeId(parentId, nodeNamingMode);
      const insertAt = findFlowInsertIndex(lines);
      lines.splice(insertAt, 0, `    subgraph ${sgId} [Grup ${sgNum}]`, `        ${childId}[${childId}]`, `    end`);
      currentTargetNode = childId;
      commitCodeChange(lines, `Subgraph ${sgId} (${childId}) ditambahkan`);
      refreshNodeDropdown(childId);
      return;
    }

    // Mode 1: Ubah bentuk node aktif saat ini
    if (nodeActionMode === 'reshape') {
      if (!parentId) {
        showToast('Pilih node terlebih dahulu untuk diubah bentuknya');
        return;
      }
      const shapeRe = buildNodeShapeRegex(parentId);
      let reshaped = false;
      for (let i = 0; i < lines.length; i++) {
        if (/^\s*(flowchart|graph|subgraph|end|direction|style|classDef|class|click|linkStyle|%%)\b/.test(lines[i])) continue;
        const m = lines[i].match(shapeRe);
        if (m) {
          const prefixChar = m[1] || '';
          const oldLabel = m.slice(3).find(v => v !== undefined) || parentId;
          lines[i] = lines[i].replace(shapeRe, `${prefixChar}${parentId}${shape.open}${oldLabel}${shape.close}`);
          reshaped = true;
          break;
        }
      }
      if (!reshaped) {
        // Jika node sebelumnya ditulis polos tanpa kurung bentuk (mis. "A --> B")
        const bareRe = new RegExp(`(^|[^A-Za-z0-9_-])(${escRe(parentId)})(?![A-Za-z0-9_@(\\[{>-])`);
        for (let i = 0; i < lines.length; i++) {
          if (/^\s*(flowchart|graph|subgraph|end|direction|style|classDef|class|click|linkStyle|%%)\b/.test(lines[i])) continue;
          if (bareRe.test(lines[i])) {
            lines[i] = lines[i].replace(bareRe, `$1$2${shape.open}${parentId}${shape.close}`);
            reshaped = true;
            break;
          }
        }
      }
      commitCodeChange(lines, `Bentuk node "${parentId}" → ${shape.open}…${shape.close}`);
      return;
    }

    // Mode 2 & 3: Tambah node baru (+Panah dari Node aktif, atau +Node mandiri)
    const newId = getNextAutoNodeId(parentId, nodeNamingMode);
    const nodeToken = `${newId}${shape.open}${newId}${shape.close}`;
    const newLine = (nodeActionMode === 'link' && parentId)
      ? `    ${parentId} --> ${nodeToken}`
      : `    ${nodeToken}`;

    const insertAt = findFlowInsertIndex(lines);
    lines.splice(insertAt, 0, newLine);

    // Pada mode A,B,C (alpha), majukan Target Node ke node baru agar klik berikutnya berantai.
    // Pada mode A1,D1 (branch), pertahankan Target Node di induk agar klik berikutnya membuat cabang saudara (D1, D2, D3...).
    const nextTarget = (nodeNamingMode === 'branch' && parentId && nodeActionMode === 'link')
      ? parentId
      : newId;
    currentTargetNode = nextTarget;
    const msg = (nodeActionMode === 'link' && parentId)
      ? `Ditambahkan: ${parentId} → ${nodeToken}`
      : `Ditambahkan: ${nodeToken}`;
    commitCodeChange(lines, msg);
    refreshNodeDropdown(nextTarget);
  }

  function isLightHex(hex) {
    const m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
    if (!m) return false;
    const n = parseInt(m[1], 16);
    const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    return (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.62;
  }

  function applyColorToTargetNode(preset) {
    refreshNodeDropdown();
    const nodeId = targetNodeSelect.value;
    if (!nodeId) {
      showToast('Tidak ada node yang terdeteksi di diagram');
      return;
    }

    const lines = mermaidCode.split('\n');
    const styleRegex = new RegExp(`^\\s*style\\s+${nodeId}\\b.*$`);

    if (!preset) {
      // Reset color: remove existing style <nodeId> line and any :::mnemonic on that node
      const filtered = lines.filter(l => !styleRegex.test(l));
      mermaidCode = filtered.join('\n');
      showToast(`Warna node "${nodeId}" di-reset`);
    } else {
      const textCol = isLightHex(preset.fill) ? '#111827' : '#fff';
      const newStyleLine = `    style ${nodeId} fill:${preset.fill},stroke:#fff,stroke-width:2px,color:${textCol}`;
      let found = false;
      const updated = lines.map(l => {
        if (styleRegex.test(l)) {
          found = true;
          return newStyleLine;
        }
        return l;
      });
      if (!found) {
        // Trim trailing blank lines before appending style line
        while (updated.length > 0 && updated[updated.length - 1].trim() === '') {
          updated.pop();
        }
        updated.push(newStyleLine);
      }
      mermaidCode = updated.join('\n') + '\n';
      showToast(`Node "${nodeId}" → ${preset.name}${preset.code ? ` (${preset.code})` : ''}`);
    }

    if (activeTab === 'code') {
      editor.value = mermaidCode;
      updateLineNumbers();
    }
    renderDiagram(true);
  }

  function collectEdges() {

  function refreshEdgeDropdown(preferredKey = null) {
    const edges = collectEdges();
    const want = preferredKey || currentTargetEdgeKey;
    const pairCount = {};
    targetEdgeSelect.innerHTML = '';
    edges.forEach(e => {
      const pair = `${e.src || '?'}→${e.dst || '?'}`;
      pairCount[pair] = (pairCount[pair] || 0) + 1;
      const opt = document.createElement('option');
      opt.value = e.key;
      opt.textContent = pairCount[pair] > 1 ? `${pair} #${pairCount[pair]}` : pair;
      targetEdgeSelect.appendChild(opt);
    });
    if (want && edges.some(e => e.key === want)) {
      currentTargetEdgeKey = want;
    } else {
      currentTargetEdgeKey = edges.length ? edges[0].key : null;
    }
    if (currentTargetEdgeKey) targetEdgeSelect.value = currentTargetEdgeKey;
  }

  targetEdgeSelect.addEventListener('change', () => {
    currentTargetEdgeKey = targetEdgeSelect.value;
  });

  function getTargetEdge() {
    refreshEdgeDropdown();
    const edges = collectEdges();
    const edge = edges.find(e => e.key === currentTargetEdgeKey);
    if (!edge) showToast('Tidak ada garis/panah flowchart yang terdeteksi');
    return { edge, edges };
  }

  // Buat ID edge yang mudah dibaca & unik, mis. e_A_B, e_A_B_2
  function makeUniqueEdgeId(edge, edges) {
    const taken = new Set(edges.map(e => e.id).filter(Boolean));
    mermaidCode.split('\n').forEach(l => extractNodesFromLine(l).forEach(n => taken.add(n.id)));
    const base = `e_${edge.src || 'x'}_${edge.dst || 'x'}`;
    let id = base, n = 2;
    while (taken.has(id)) id = `${base}_${n++}`;
    return id;
  }

  // Simpan perubahan kode, pertahankan posisi kursor & scroll editor
  function commitCodeChange(lines, toastMsg) {
    while (lines.length > 0 && lines[lines.length - 1].trim() === '') lines.pop();
    mermaidCode = lines.join('\n') + '\n';
    if (activeTab === 'code') {
      const pos = editor.selectionStart, scroll = editor.scrollTop;
      editor.value = mermaidCode;
      editor.selectionStart = editor.selectionEnd = Math.min(pos, mermaidCode.length);
      editor.scrollTop = scroll;
      updateLineNumbers();
    }
    if (toastMsg) showToast(toastMsg);
    renderDiagram(true);
  }

  // Hapus classDef ln<Warna> yang sudah tidak dipakai edge mana pun
  function pruneUnusedLineClassDefs(lines) {
    const used = new Set();
    lines.forEach(l => {
      const m = l.match(/^\s*class\s+\S+\s+(ln[A-Za-z0-9_]+)\s*;?\s*$/);
      if (m) used.add(m[1]);
    });
    return lines.filter(l => {
      const m = l.match(/^\s*classDef\s+(ln[A-Za-z0-9_]+)\b/);
      return !m || used.has(m[1]);
    });
  }

  function applyEdgeColor(preset) {
    const { edge, edges } = getTargetEdge();
    if (!edge) return;
    let lines = mermaidCode.split('\n');
    let edgeId = edge.id;
    const label = `${edge.src || '?'}→${edge.dst || '?'}`;

    if (!preset) {
      if (!edgeId) { showToast(`Garis ${label} belum punya warna kustom`); return; }
      const clsLineRe = new RegExp(`^\\s*class\\s+${escRe(edgeId)}\\s+ln[A-Za-z0-9_]+\\s*;?\\s*$`);
      lines = pruneUnusedLineClassDefs(lines.filter(l => !clsLineRe.test(l)));
      commitCodeChange(lines, `Warna garis ${label} di-reset`);
      return;
    }

    // 1) Pasang Edge ID pada panah bila belum ada: "A --> B" → "A e_A_B@--> B"
    if (!edgeId) {
      edgeId = makeUniqueEdgeId(edge, edges);
      const ln = lines[edge.lineIdx];
      const needSpace = edge.start > 0 && !/\s/.test(ln[edge.start - 1]);
      lines[edge.lineIdx] = ln.slice(0, edge.start) + (needSpace ? ' ' : '') + `${edgeId}@` + ln.slice(edge.start);
    }

    // 2) Ganti class warna lama → baru
    const safeSuffix = (preset.name || '').replace(/[^A-Za-z0-9_]/g, '');
    const clsName = `ln${safeSuffix}`;
    const clsLineRe = new RegExp(`^\\s*class\\s+${escRe(edgeId)}\\s+ln[A-Za-z0-9_]+\\s*;?\\s*$`);
    lines = lines.filter(l => !clsLineRe.test(l));
    while (lines.length > 0 && lines[lines.length - 1].trim() === '') lines.pop();

    // 3) Pastikan classDef warna ada (sekali saja per warna)
    if (!lines.some(l => new RegExp(`^\\s*classDef\\s+${clsName}\\b`).test(l))) {
      // tanpa stroke-width agar ketebalan tetap dikendalikan tipe panah (-->, -.->, ==>)
      lines.push(`    classDef ${clsName} stroke:${preset.color},color:${preset.color}`);
    }
    lines.push(`    class ${edgeId} ${clsName}`);
    lines = pruneUnusedLineClassDefs(lines);
    commitCodeChange(lines, `Garis ${label} → ${preset.label || preset.color}`);
  }

  // Ganti tipe garis langsung di sintaks panah: solid (-->), putus-putus (-.->), tebal (==>), tanpa panah (---), dua arah (<-->)
  function applyEdgeType(kind) {
    const { edge } = getTargetEdge();
    if (!edge) return;
    const lines = mermaidCode.split('\n');
    const curArrow = edge.close || edge.arrow;
    const lastChar = curArrow.slice(-1);
    const curHasHead = '>xo'.includes(lastChar);
    const curIsDashed = curArrow.includes('.');
    const curIsThick = curArrow.includes('=');

    let newArrow;
    if (kind === 'nohead') {
      newArrow = curIsDashed ? '-.-' : (curIsThick ? '===' : '---');
    } else if (kind === 'bidir') {
      newArrow = curIsDashed ? '<-.->' : (curIsThick ? '<==>' : '<-->');
    } else {
      const head = curHasHead ? lastChar : '>';
      const bidir = edge.arrow.startsWith('<');
      const body = { solid: '--', dashed: '-.-', thick: '==' }[kind];
      newArrow = (bidir ? '<' : '') + body + head;
    }
    const repl = newArrow + (edge.inlineText ? `|${edge.inlineText}|` : '');
    const ln = lines[edge.lineIdx];
    lines[edge.lineIdx] = ln.slice(0, edge.arrowStart) + repl + ln.slice(edge.end);
    const names = { solid: 'solid (-->)', dashed: 'putus-putus (-.->)', thick: 'tebal (==>)', nohead: 'tanpa panah (---)', bidir: 'dua arah (<-->)' };
    commitCodeChange(lines, `Garis ${edge.src || '?'}→${edge.dst || '?'} → ${names[kind]}`);
  }

  function initLineControls() {
    lineSwatchGrid.innerHTML = '';
    LINE_PRESETS.forEach(p => {
      const btn = document.createElement('button');
      btn.className = 'line-swatch';
      btn.style.setProperty('--sw', p.color);
      btn.title = `${p.label || p.name} (${p.color})`;
      btn.onclick = () => applyEdgeColor(p);
      lineSwatchGrid.appendChild(btn);
    });
    const kindOf = { '-->': 'solid', '-.->': 'dashed', '==>': 'thick', '---': 'nohead', '<-->': 'bidir' };
    document.querySelectorAll('.line-type-btn').forEach(b => {
      b.onclick = () => applyEdgeType(kindOf[b.dataset.arrow]);
    });
    const edgeCustomInput = document.getElementById('edge-custom-color');
    if (edgeCustomInput) {
      edgeCustomInput.addEventListener('change', (e) => {
        const hex = e.target.value;
        applyEdgeColor({ name: '_' + hex.replace('#', ''), label: hex, color: hex });
      });
    }
    document.getElementById('btn-edge-reset').onclick = () => applyEdgeColor(null);
  }
  initLineControls();

  // Pilih edge dari klik garis di SVG. Path id Mermaid: "<renderId>-<edgeId>" atau "<renderId>-L_<src>_<dst>_<n>"
  function selectEdgeFromPathId(pathId) {
    const edges = collectEdges();
    let found = edges.find(e => e.id && pathId.endsWith(`-${e.id}`));
    if (!found) {
      const seen = {};
      found = edges.find(e => {
        if (e.id) return false;
        const pair = `L_${e.src}_${e.dst}_`;
        const n = seen[pair] = (seen[pair] ?? -1) + 1;
        return pathId.endsWith(`-${pair}${n}`);
      });
    }
    if (found) {
      refreshEdgeDropdown(found.key);
      showToast(`Target Garis dipilih: ${found.src}→${found.dst}`);
    }
  }

  let lnMirror = null;
  function updateLineNumbers() {
    const rawLines = editor.value.split('\n');
    if (!lnMirror) {
      lnMirror = document.createElement('div');
      lnMirror.style.cssText = 'position:absolute;top:-9999px;left:-9999px;visibility:hidden;pointer-events:none;white-space:pre-wrap;overflow-wrap:break-word;word-break:break-word;font-family:"JetBrains Mono","Fira Code","SF Mono",Menlo,Consolas,monospace;font-size:13px;line-height:20px;tab-size:2;padding:0;margin:0;border:0;box-sizing:content-box;';
      document.body.appendChild(lnMirror);
    }
    const contentW = Math.max(40, (editor.clientWidth || 300) - 28);
    lnMirror.style.width = `${contentW}px`;
    lnMirror.innerHTML = '';
    const frag = document.createDocumentFragment();
    rawLines.forEach(l => {
      const row = document.createElement('div');
      row.textContent = l || ' ';
      frag.appendChild(row);
    });
    lnMirror.appendChild(frag);

    const children = lnMirror.children;
    let html = '';
    for (let i = 0; i < rawLines.length; i++) {
      const h = children[i] ? Math.max(20, children[i].offsetHeight) : 20;
      html += `<div style="height:${h}px">${i + 1}</div>`;
    }
    lineNumbers.innerHTML = html;
  }

  function updateCursorInfo() {
    const pos = editor.selectionStart || 0;
    const upto = editor.value.slice(0, pos).split('\n');
    const lineIdx = upto.length - 1;
    const colIdx = upto[lineIdx].length;
    cursorPos.textContent = `Ln ${lineIdx + 1}, Col ${colIdx + 1}`;

    if (activeTab === 'code') {
      const allLines = editor.value.split('\n');
      const currentLine = allLines[lineIdx] || '';
      const nodesOnLine = extractNodesFromLine(currentLine);
      if (nodesOnLine.length === 1) {
        currentTargetNode = nodesOnLine[0].id;
        refreshNodeDropdown(currentTargetNode);
      } else if (nodesOnLine.length >= 2) {
        const arrowMatch = currentLine.match(/--+>|--+|\.-+>|\.-+|==+>/);
        if (arrowMatch && colIdx <= arrowMatch.index) {
          currentTargetNode = nodesOnLine[0].id;
        } else {
          currentTargetNode = nodesOnLine[nodesOnLine.length - 1].id;
        }
        refreshNodeDropdown(currentTargetNode);
      }

      // Auto-pilih garis terdekat dari kursor bila baris berisi panah
      if (isFlowchartCode()) {
        const lineEdges = tokenizeFlowLine(currentLine).edges;
        if (lineEdges.length) {
          let best = 0, bestDist = Infinity;
          lineEdges.forEach((e, ord) => {
            const d = colIdx < e.start ? e.start - colIdx : (colIdx > e.end ? colIdx - e.end : 0);
            if (d < bestDist) { bestDist = d; best = ord; }
          });
          refreshEdgeDropdown(`${lineIdx}:${best}`);
        }
      }
    }
  }

  editor.addEventListener('scroll', () => {
    lineNumbers.scrollTop = editor.scrollTop;
  });
  editor.addEventListener('click', updateCursorInfo);
  editor.addEventListener('keyup', updateCursorInfo);

  editor.addEventListener('keydown', (e) => {
    if (e.key === 'Tab') {
      e.preventDefault();
      const start = editor.selectionStart;
      const end = editor.selectionEnd;
      editor.value = editor.value.substring(0, start) + '    ' + editor.value.substring(end);
      editor.selectionStart = editor.selectionEnd = start + 4;
      onEditorInput();
    }
  });

  const aoiToolbar = document.getElementById('aoi-toolbar');
  const aoiOverlay = document.getElementById('aoi-overlay');
  const aoiRectEl = document.getElementById('aoi-rect');
  const aoiBadgeEl = document.getElementById('aoi-badge');
  const aoiXInput = document.getElementById('aoi-x');
  const aoiYInput = document.getElementById('aoi-y');
  const aoiWInput = document.getElementById('aoi-w');
  const aoiHInput = document.getElementById('aoi-h');
  const aoiPadInput = document.getElementById('aoi-pad');
  const aoiScaleSelect = document.getElementById('aoi-scale');
  const aoiBgSelect = document.getElementById('aoi-bg');
  const btnToggleAoi = document.getElementById('btn-toggle-aoi');
  const btnAoiCanvas = document.getElementById('btn-aoi-canvas');
  const btnAoiDraw = document.getElementById('btn-aoi-draw');

  let aoiVisible = false;
  let aoiCustom = false;
  let aoiDrawingMode = false;
  let aoiBox = { x: 0, y: 0, w: 400, h: 400 };

  function getViewportInnerGroup() {
    const svgEl = container.querySelector('svg');
    if (!svgEl) return null;
    return svgEl.querySelector('.svg-pan-zoom_viewport > g')
      || svgEl.querySelector('.svg-pan-zoom_viewport')
      || svgEl;
  }

  function svgPointToPane(svgX, svgY) {
    const svgEl = container.querySelector('svg');
    const vp = getViewportInnerGroup();
    if (!svgEl || !vp || !vp.getScreenCTM) return { x: 0, y: 0 };
    const ctm = vp.getScreenCTM();
    if (!ctm) return { x: 0, y: 0 };
    const pt = svgEl.createSVGPoint();
    pt.x = svgX;
    pt.y = svgY;
    const screenPt = pt.matrixTransform(ctm);
    const paneRect = rightPane.getBoundingClientRect();
    return {
      x: screenPt.x - paneRect.left,
      y: screenPt.y - paneRect.top
    };
  }

  function panePointToSvg(paneX, paneY) {
    const svgEl = container.querySelector('svg');
    const vp = getViewportInnerGroup();
    if (!svgEl || !vp || !vp.getScreenCTM) return { x: 0, y: 0 };
    const ctm = vp.getScreenCTM();
    if (!ctm) return { x: 0, y: 0 };
    const paneRect = rightPane.getBoundingClientRect();
    const pt = svgEl.createSVGPoint();
    pt.x = paneRect.left + paneX;
    pt.y = paneRect.top + paneY;
    const svgPt = pt.matrixTransform(ctm.inverse());
    return { x: svgPt.x, y: svgPt.y };
  }

  function fitAoiToDiagram() {
    if (!lastDiagramBox) return;
    const pad = Math.max(0, Number(aoiPadInput.value) || 0);
    aoiBox = {
      x: Math.round(lastDiagramBox.x - pad),
      y: Math.round(lastDiagramBox.y - pad),
      w: Math.max(20, Math.round(lastDiagramBox.width + pad * 2)),
      h: Math.max(20, Math.round(lastDiagramBox.height + pad * 2))
    };
    aoiCustom = false;
    syncAoiInputsAndOverlay();
  }

  function syncAoiInputsAndOverlay() {
    aoiXInput.value = Math.round(aoiBox.x);
    aoiYInput.value = Math.round(aoiBox.y);
    aoiWInput.value = Math.max(10, Math.round(aoiBox.w));
    aoiHInput.value = Math.max(10, Math.round(aoiBox.h));
    updateAoiOverlayPosition();
  }

  function updateAoiOverlayPosition() {
    if (!aoiVisible) return;
    const p1 = svgPointToPane(aoiBox.x, aoiBox.y);
    const p2 = svgPointToPane(aoiBox.x + aoiBox.w, aoiBox.y + aoiBox.h);
    const left = Math.min(p1.x, p2.x);
    const top = Math.min(p1.y, p2.y);
    const width = Math.max(8, Math.abs(p2.x - p1.x));
    const height = Math.max(8, Math.abs(p2.y - p1.y));

    aoiRectEl.style.left = `${left}px`;
    aoiRectEl.style.top = `${top}px`;
    aoiRectEl.style.width = `${width}px`;
    aoiRectEl.style.height = `${height}px`;

    const scale = Number(aoiScaleSelect.value) || 4;
    const outW = Math.round(aoiBox.w * scale);
    const outH = Math.round(aoiBox.h * scale);
    aoiBadgeEl.textContent = `AOI: ${Math.round(aoiBox.w)}×${Math.round(aoiBox.h)}  •  PNG ${scale}×: ${outW}×${outH} px`;
  }

  function setAoiVisible(vis) {
    aoiVisible = vis;
    aoiToolbar.classList.toggle('visible', vis);
    aoiOverlay.classList.toggle('visible', vis);
    btnToggleAoi.classList.toggle('btn-primary', vis);
    btnAoiCanvas.classList.toggle('active', vis);
    if (!vis) {
      setAoiDrawingMode(false);
    } else {
      if (!aoiCustom) fitAoiToDiagram();
      updateAoiOverlayPosition();
      const topPx = parseFloat(aoiRectEl.style.top || '0');
      if (pz && topPx < 54) {
        pz.panBy({ x: 0, y: 54 - topPx });
        updateAoiOverlayPosition();
      }
    }
  }

  function setAoiDrawingMode(enabled) {
    aoiDrawingMode = enabled;
    aoiOverlay.classList.toggle('drawing-mode', enabled);
    btnAoiDraw.classList.toggle('active', enabled);
  }

  function updateZoomReadout() {
    if (!pz) return;
    zoomLabel.textContent = `${Math.round(pz.getZoom() * 100)}%`;
    updateAoiOverlayPosition();
  }

  function resetView() {
    if (!pz) return;
    pz.resize();
    pz.fit();
    pz.center();
    pz.zoom(0.875);
    updateZoomReadout();
  }

  function computeTightDiagramBox(svgEl) {
    let rawBox = null;
    try {
      const target = svgEl.querySelector('g.root') || svgEl;
      const b = target.getBBox();
      if (b && b.width > 0 && b.height > 0) {
        rawBox = { x: b.x, y: b.y, width: b.width, height: b.height };
      }
    } catch (_) {}
    if (!rawBox) {
      const vb = (svgEl.getAttribute('viewBox') || '').trim().split(/[\s,]+/).map(Number);
      if (vb.length === 4 && vb.every(n => !Number.isNaN(n)) && vb[2] > 0 && vb[3] > 0) {
        rawBox = { x: vb[0], y: vb[1], width: vb[2], height: vb[3] };
      }
    }
    return rawBox || { x: 0, y: 0, width: 400, height: 400 };
  }

  async function renderDiagram(preserveViewport = true) {
    refreshNodeDropdown();
    let parsedConfig = { theme: 'redux-dark-color' };
    try {
      parsedConfig = JSON.parse(configCode);
    } catch (err) {
      errorBanner.textContent = `JSON Config Error:\n${err.message}`;
      errorBanner.classList.add('visible');
      statusDot.classList.add('err');
      statusText.textContent = 'Config JSON Error';
      return;
    }

    let prevZoom = null;
    let prevPan = null;
    if (preserveViewport && pz && !isFirstRender) {
      try {
        prevZoom = pz.getZoom();
        prevPan = pz.getPan();
      } catch (_) {}
    }

    try {
      // Sanitasi user config agar tidak menurunkan securityLevel
      const sanitizedConfig = { ...parsedConfig };
      delete sanitizedConfig.securityLevel;
      delete sanitizedConfig.secure;
      delete sanitizedConfig.startOnLoad;

      mermaid.initialize({
        startOnLoad: false,
        securityLevel: 'antiscript',
        secure: ['secure', 'securityLevel', 'startOnLoad', 'maxTextSize', 'maxEdges', 'htmlLabels'],
        maxTextSize: 100000,
        flowchart: {
          htmlLabels: true,
          ...(sanitizedConfig.flowchart || {})
        },
        ...sanitizedConfig,
        securityLevel: 'antiscript'
      });

      // Support built-in shorthand mnemonics (e.g. :::M, :::B, :::H, :::M1, :::PT) if used in flowchart
      let codeToRender = mermaidCode;
      if (/^\s*(flowchart|graph)\b/m.test(mermaidCode) && /:::[A-Za-z0-9_]+/.test(mermaidCode)) {
        const mnemonicDefs = COLOR_PRESETS
          .map(p => `    classDef ${p.code} fill:${p.fill},stroke:#fff,stroke-width:2px,color:${isLightHex(p.fill) ? '#111827' : '#fff'}`)
          .join('\n');
        codeToRender = `${mermaidCode}\n${mnemonicDefs}\n`;
      }

      renderCounter++;
      const id = `mermaid-svg-${renderCounter}`;
      const { svg } = await mermaid.render(id, codeToRender);

      if (pz) {
        try { pz.destroy(); } catch (_) {}
        pz = null;
      }

      container.innerHTML = svg;

      // Sanitasi link di dalam SVG
      container.querySelectorAll('a').forEach(anchor => {
        const href = anchor.getAttribute('href') || '';
        if (/^(javascript|data|vbscript):/i.test(href)) {
          anchor.removeAttribute('href');
        }
      });

      // Klik langsung pada node di kanvas diagram untuk memilih Target Node
      container.querySelectorAll('g.node').forEach(nodeGroup => {
        nodeGroup.style.cursor = 'pointer';
        nodeGroup.addEventListener('click', (e) => {
          e.stopPropagation();
          const rawId = nodeGroup.id || '';
          const m = rawId.match(/^flowchart-(.+)-\d+$/);
          if (m && m[1]) {
            currentTargetNode = m[1];
            refreshNodeDropdown(currentTargetNode);
            showToast(`Target Node dipilih: "${currentTargetNode}"`);
          }
        });
      });

      // Klik langsung pada garis/panah di kanvas untuk memilih Target Garis
      container.querySelectorAll('path.flowchart-link').forEach(pathEl => {
        pathEl.style.cursor = 'pointer';
        pathEl.style.pointerEvents = 'visibleStroke';
        pathEl.addEventListener('click', (e) => {
          e.stopPropagation();
          selectEdgeFromPathId(pathEl.id || '');
        });
      });
      refreshEdgeDropdown();

      const svgEl = container.querySelector('svg');

      // Simpan SVG murni & bounding box fokus area diagram sebelum dimodifikasi svgPanZoom
      lastCleanSvg = svgEl.cloneNode(true);
      lastDiagramBox = computeTightDiagramBox(svgEl);

      pz = svgPanZoom(svgEl, {
        zoomEnabled: true,
        panEnabled: true,
        controlIconsEnabled: false,
        fit: true,
        center: true,
        minZoom: 0.1,
        maxZoom: 20,
        zoomScaleSensitivity: 0.3,
        onZoom: updateZoomReadout,
        onPan: updateAoiOverlayPosition
      });

      if (isFirstRender || !preserveViewport || prevZoom === null) {
        resetView();
        isFirstRender = false;
      } else {
        pz.zoom(prevZoom);
        pz.pan(prevPan);
        updateZoomReadout();
      }

      if (!aoiCustom) {
        fitAoiToDiagram();
      } else {
        updateAoiOverlayPosition();
      }

      errorBanner.classList.remove('visible');
      statusDot.classList.remove('err');
      statusText.textContent = 'Synced (100% Offline)';
    } catch (err) {
      errorBanner.textContent = err?.message || String(err);
      errorBanner.classList.add('visible');
      statusDot.classList.add('err');
      statusText.textContent = 'Syntax Error';
    }
  }

  let debounceTimer = null;
  function onEditorInput() {
    if (activeTab === 'code') {
      mermaidCode = editor.value;
    } else {
      configCode = editor.value;
      try {
        const cfg = JSON.parse(configCode);
        if (cfg.theme && [...themeSelect.options].some(o => o.value === cfg.theme)) {
          themeSelect.value = cfg.theme;
        }
      } catch (_) {}
    }
    updateLineNumbers();
    updateCursorInfo();

    if (!autoSync.checked) {
      statusText.textContent = 'Modified (Auto-Sync off)';
      return;
    }
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => renderDiagram(true), 160);
  }

  editor.addEventListener('input', onEditorInput);

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeTab = btn.dataset.tab;
      editor.value = activeTab === 'code' ? mermaidCode : configCode;
      updateLineNumbers();
      updateCursorInfo();
    });
  });

  themeSelect.addEventListener('change', () => {
    try {
      const cfg = JSON.parse(configCode);
      cfg.theme = themeSelect.value;
      configCode = JSON.stringify(cfg, null, 2);
    } catch (_) {
      configCode = JSON.stringify({ theme: themeSelect.value }, null, 2);
    }
    if (activeTab === 'config') {
      editor.value = configCode;
      updateLineNumbers();
    }
    renderDiagram(true);
  });

  const fileNameInput = document.getElementById('file-name-input');
  const fileInputMmd = document.getElementById('file-input-mmd');

  function getBaseFileName() {
    const raw = (fileNameInput.value || 'diagram.mmd').trim();
    return raw.replace(/\.(mmd|mermaid|txt|md)$/i, '') || 'diagram';
  }

  function getMmdFileName() {
    const raw = (fileNameInput.value || 'diagram.mmd').trim();
    return /\.(mmd|mermaid)$/i.test(raw) ? raw : `${raw}.mmd`;
  }

  function loadMmdContent(content, name = 'diagram.mmd') {
    mermaidCode = content;
    fileNameInput.value = name;
    aoiCustom = false;
    if (activeTab !== 'code') {
      document.querySelector('.tab-btn[data-tab="code"]').click();
    } else {
      editor.value = mermaidCode;
      updateLineNumbers();
      updateCursorInfo();
    }
    renderDiagram(false);
    showToast(`File "${name}" berhasil dimuat!`);
  }

  document.getElementById('btn-load-mmd').onclick = async () => {
    if (window.showOpenFilePicker) {
      try {
        const [handle] = await window.showOpenFilePicker({
          types: [{
            description: 'Mermaid Diagram (.mmd, .mermaid)',
            accept: { 'text/plain': ['.mmd', '.mermaid', '.txt', '.md'] }
          }],
          multiple: false
        });
        const file = await handle.getFile();
        const text = await file.text();
        loadMmdContent(text, file.name);
        return;
      } catch (err) {
        if (err.name === 'AbortError') return;
      }
    }
    fileInputMmd.value = '';
    fileInputMmd.click();
  };

  fileInputMmd.addEventListener('change', async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const text = await file.text();
    loadMmdContent(text, file.name);
  });

  async function saveMmdFile() {
    const suggestedName = getMmdFileName();
    fileNameInput.value = suggestedName;

    if (window.showSaveFilePicker) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName,
          types: [{
            description: 'Mermaid Diagram (.mmd)',
            accept: { 'text/plain': ['.mmd', '.mermaid'] }
          }]
        });
        const writable = await handle.createWritable();
        await writable.write(mermaidCode);
        await writable.close();
        fileNameInput.value = handle.name;
        showToast(`Disimpan ke "${handle.name}"!`);
        return;
      } catch (err) {
        if (err.name === 'AbortError') return;
      }
    }

    const blob = new Blob([mermaidCode], { type: 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = suggestedName;
    a.click();
    showToast(`File "${suggestedName}" berhasil diunduh!`);
  }

  document.getElementById('btn-save-mmd').onclick = saveMmdFile;

  window.addEventListener('dragover', (e) => {
    e.preventDefault();
    document.body.classList.add('drag-over');
  });
  window.addEventListener('dragleave', (e) => {
    if (e.relatedTarget === null) document.body.classList.remove('drag-over');
  });
  window.addEventListener('drop', async (e) => {
    e.preventDefault();
    document.body.classList.remove('drag-over');
    const file = e.dataTransfer?.files?.[0];
    if (!file) return;
    const text = await file.text();
    loadMmdContent(text, file.name);
  });

  window.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') {
      e.preventDefault();
      saveMmdFile();
    } else if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'o') {
      e.preventDefault();
      document.getElementById('btn-load-mmd').click();
    } else if (e.key === 'Escape' && aoiVisible) {
      setAoiVisible(false);
    }
  });

  sampleSelect.addEventListener('change', () => {
    mermaidCode = SAMPLES[sampleSelect.value] || SAMPLES.christmas;
    fileNameInput.value = `${sampleSelect.value}.mmd`;
    aoiCustom = false;
    if (activeTab === 'code') {
      editor.value = mermaidCode;
      updateLineNumbers();
    }
    renderDiagram(false);
  });

  autoSync.addEventListener('change', () => {
    if (autoSync.checked) renderDiagram(true);
  });

  document.getElementById('zin').onclick = () => { pz?.zoomIn(); updateZoomReadout(); };
  document.getElementById('zout').onclick = () => { pz?.zoomOut(); updateZoomReadout(); };
  document.getElementById('zreset').onclick = resetView;

  const btnGrid = document.getElementById('btn-grid');
  btnGrid.onclick = () => {
    rightPane.classList.toggle('grid-on');
    btnGrid.classList.toggle('active');
  };

  const btnBg = document.getElementById('btn-bg');
  btnBg.onclick = () => {
    rightPane.classList.toggle('light-canvas');
    btnBg.classList.toggle('active');
  };

  document.getElementById('btn-copy-code').onclick = async () => {
    await navigator.clipboard.writeText(mermaidCode);
    showToast('Kode Mermaid berhasil disalin!');
  };

  // --- Interaksi Kotak Area of Interest (AOI) ---
  btnToggleAoi.onclick = () => setAoiVisible(!aoiVisible);
  btnAoiCanvas.onclick = () => setAoiVisible(!aoiVisible);
  document.getElementById('btn-aoi-close').onclick = () => setAoiVisible(false);
  document.getElementById('btn-aoi-fit').onclick = () => {
    fitAoiToDiagram();
    showToast('Kotak AOI dipaskan ke seluruh diagram');
  };
  btnAoiDraw.onclick = () => {
    setAoiDrawingMode(!aoiDrawingMode);
    if (aoiDrawingMode) showToast('Klik & tarik di kanvas untuk menggambar kotak AOI baru');
  };

  [aoiXInput, aoiYInput, aoiWInput, aoiHInput].forEach(inp => {
    inp.addEventListener('input', () => {
      aoiCustom = true;
      aoiBox.x = Number(aoiXInput.value) || 0;
      aoiBox.y = Number(aoiYInput.value) || 0;
      aoiBox.w = Math.max(10, Number(aoiWInput.value) || 10);
      aoiBox.h = Math.max(10, Number(aoiHInput.value) || 10);
      updateAoiOverlayPosition();
    });
  });

  aoiPadInput.addEventListener('input', () => {
    if (!aoiCustom) fitAoiToDiagram();
  });

  aoiScaleSelect.addEventListener('change', updateAoiOverlayPosition);

  let aoiDragState = null;

  aoiRectEl.addEventListener('mousedown', (e) => {
    if (aoiDrawingMode) return;
    e.stopPropagation();
    e.preventDefault();
    const handle = e.target.closest('.aoi-handle');
    const mode = handle ? handle.dataset.dir : 'move';
    const startSvg = panePointToSvg(
      e.clientX - rightPane.getBoundingClientRect().left,
      e.clientY - rightPane.getBoundingClientRect().top
    );
    aoiDragState = {
      mode,
      startSvg,
      origBox: { ...aoiBox }
    };
  });

  aoiOverlay.addEventListener('mousedown', (e) => {
    if (!aoiDrawingMode) return;
    e.stopPropagation();
    e.preventDefault();
    const rect = rightPane.getBoundingClientRect();
    const startSvg = panePointToSvg(e.clientX - rect.left, e.clientY - rect.top);
    aoiCustom = true;
    aoiBox = { x: startSvg.x, y: startSvg.y, w: 10, h: 10 };
    syncAoiInputsAndOverlay();
    aoiDragState = {
      mode: 'draw',
      startSvg,
      origBox: { ...aoiBox }
    };
  });

  window.addEventListener('mousemove', (e) => {
    if (!aoiDragState) return;
    const rect = rightPane.getBoundingClientRect();
    const curSvg = panePointToSvg(e.clientX - rect.left, e.clientY - rect.top);
    const dx = curSvg.x - aoiDragState.startSvg.x;
    const dy = curSvg.y - aoiDragState.startSvg.y;
    const b = aoiDragState.origBox;
    const mode = aoiDragState.mode;
    aoiCustom = true;

    if (mode === 'move') {
      aoiBox.x = b.x + dx;
      aoiBox.y = b.y + dy;
    } else if (mode === 'draw') {
      const x1 = Math.min(aoiDragState.startSvg.x, curSvg.x);
      const y1 = Math.min(aoiDragState.startSvg.y, curSvg.y);
      const x2 = Math.max(aoiDragState.startSvg.x, curSvg.x);
      const y2 = Math.max(aoiDragState.startSvg.y, curSvg.y);
      aoiBox = { x: x1, y: y1, w: Math.max(10, x2 - x1), h: Math.max(10, y2 - y1) };
    } else {
      let x1 = b.x;
      let y1 = b.y;
      let x2 = b.x + b.w;
      let y2 = b.y + b.h;
      if (mode.includes('w')) x1 = Math.min(x2 - 10, b.x + dx);
      if (mode.includes('e')) x2 = Math.max(x1 + 10, b.x + b.w + dx);
      if (mode.includes('n')) y1 = Math.min(y2 - 10, b.y + dy);
      if (mode.includes('s')) y2 = Math.max(y1 + 10, b.y + b.h + dy);
      aoiBox = { x: x1, y: y1, w: x2 - x1, h: y2 - y1 };
    }
    syncAoiInputsAndOverlay();
  });

  window.addEventListener('mouseup', () => {
    if (!aoiDragState) return;
    if (aoiDragState.mode === 'draw') {
      setAoiDrawingMode(false);
    }
    aoiDragState = null;
  });

  function getActiveExportBox() {
    if (!aoiCustom && lastDiagramBox) {
      const pad = Math.max(0, Number(aoiPadInput.value) || 0);
      return {
        x: lastDiagramBox.x - pad,
        y: lastDiagramBox.y - pad,
        w: Math.max(20, lastDiagramBox.width + pad * 2),
        h: Math.max(20, lastDiagramBox.height + pad * 2)
      };
    }
    return {
      x: aoiBox.x,
      y: aoiBox.y,
      w: Math.max(10, aoiBox.w),
      h: Math.max(10, aoiBox.h)
    };
  }

  function getSelectedBgColor() {
    const val = aoiBgSelect.value;
    if (val === 'transparent') return null;
    if (val === 'canvas') {
      return rightPane.classList.contains('light-canvas') ? '#f8f9fb' : '#1b1b1f';
    }
    return val;
  }

  function inlineFontAwesomeIcons(liveSvg, clonedSvg) {
    if (!liveSvg || !clonedSvg) return;
    clonedSvg.querySelectorAll('foreignObject').forEach(fo => {
      fo.setAttribute('overflow', 'visible');
      fo.style.overflow = 'visible';
      if (fo.firstElementChild) {
        fo.firstElementChild.style.overflow = 'visible';
      }
    });
    const liveIcons = liveSvg.querySelectorAll('i[class*="fa-"]');
    const clonedIcons = clonedSvg.querySelectorAll('i[class*="fa-"]');
    liveIcons.forEach((liveIcon, idx) => {
      const targetIcon = clonedIcons[idx];
      if (!targetIcon) return;
      try {
        const beforeStyle = window.getComputedStyle(liveIcon, '::before');
        const rawContent = beforeStyle.content || '';
        const glyph = rawContent.replace(/^["']|["']$/g, '');
        if (!glyph || glyph === 'none') return;
        const c = document.createElement('canvas');
        c.width = 96;
        c.height = 96;
        const ctx = c.getContext('2d');
        const weight = beforeStyle.fontWeight || '900';
        const family = beforeStyle.fontFamily || '"Font Awesome 6 Free"';
        const color = beforeStyle.color || window.getComputedStyle(liveIcon).color || '#ffffff';
        ctx.font = `${weight} 68px ${family}`;
        ctx.fillStyle = color;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(glyph, 48, 50);
        const img = document.createElement('img');
        img.src = c.toDataURL('image/png');
        img.style.cssText = 'width:0.95em;height:0.95em;vertical-align:-0.12em;display:inline-block;margin:0;';
        targetIcon.replaceWith(img);
      } catch (_) {}
    });
  }

  function exportSvgWithAoi() {
    if (!lastCleanSvg) return;
    const box = getActiveExportBox();
    const bgColor = getSelectedBgColor();
    const liveSvg = container.querySelector('svg');
    const cloned = lastCleanSvg.cloneNode(true);
    inlineFontAwesomeIcons(liveSvg, cloned);

    cloned.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
    cloned.setAttribute('xmlns:xlink', 'http://www.w3.org/1999/xlink');
    cloned.setAttribute('viewBox', `${box.x} ${box.y} ${box.w} ${box.h}`);
    cloned.setAttribute('width', String(Math.round(box.w)));
    cloned.setAttribute('height', String(Math.round(box.h)));
    cloned.setAttribute('style', `max-width:none;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;${bgColor ? `background-color:${bgColor};` : ''}`);

    if (bgColor) {
      const bgRect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      bgRect.setAttribute('x', String(box.x));
      bgRect.setAttribute('y', String(box.y));
      bgRect.setAttribute('width', String(box.w));
      bgRect.setAttribute('height', String(box.h));
      bgRect.setAttribute('fill', bgColor);
      cloned.insertBefore(bgRect, cloned.firstChild);
    }

    const svgData = new XMLSerializer().serializeToString(cloned);
    const blob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${getBaseFileName()}.svg`;
    a.click();
    showToast(`SVG berhasil diunduh (${Math.round(box.w)}×${Math.round(box.h)})!`);
  }

  function exportPngWithAoi() {
    if (!lastCleanSvg) return;
    const box = getActiveExportBox();
    const userScale = Number(aoiScaleSelect.value) || 4;
    const maxLongSide = 7680;
    const longest = Math.max(box.w, box.h, 1);
    let scale = userScale;
    if (longest * scale > maxLongSide) {
      scale = maxLongSide / longest;
    }

    const outW = Math.max(1, Math.round(box.w * scale));
    const outH = Math.max(1, Math.round(box.h * scale));
    const bgColor = getSelectedBgColor();

    const liveSvg = container.querySelector('svg');
    const cloned = lastCleanSvg.cloneNode(true);
    inlineFontAwesomeIcons(liveSvg, cloned);

    cloned.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
    cloned.setAttribute('xmlns:xlink', 'http://www.w3.org/1999/xlink');
    cloned.setAttribute('viewBox', `${box.x} ${box.y} ${box.w} ${box.h}`);
    cloned.setAttribute('width', String(outW));
    cloned.setAttribute('height', String(outH));
    cloned.setAttribute(
      'style',
      `width:${outW}px;height:${outH}px;max-width:none;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;${bgColor ? `background-color:${bgColor};` : ''}`
    );

    const svgData = new XMLSerializer().serializeToString(cloned);
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = outW;
      canvas.height = outH;
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      if (bgColor) {
        ctx.fillStyle = bgColor;
        ctx.fillRect(0, 0, outW, outH);
      }
      ctx.drawImage(img, 0, 0, outW, outH);
      const a = document.createElement('a');
      a.href = canvas.toDataURL('image/png');
      a.download = `${getBaseFileName()}.png`;
      a.click();
      showToast(`PNG (${outW}×${outH} px • ${userScale}×) berhasil diunduh!`);
    };
    img.onerror = () => {
      showToast('Gagal mengekspor PNG');
    };
    img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgData)));
  }

  document.getElementById('btn-download-svg').onclick = exportSvgWithAoi;
  document.getElementById('btn-download-png').onclick = exportPngWithAoi;
  document.getElementById('btn-aoi-svg').onclick = exportSvgWithAoi;
  document.getElementById('btn-aoi-png').onclick = exportPngWithAoi;

  const safetyCheck = document.getElementById('safety-lock-check');
  const safetyGroup = document.getElementById('safety-group');
  const safetyIcon = document.getElementById('safety-lock-icon');
  const btnOpenLive = document.getElementById('btn-open-live');

  function setSafetyArmed(armed) {
    safetyCheck.checked = armed;
    btnOpenLive.disabled = !armed;
    safetyGroup.classList.toggle('armed', armed);
    safetyIcon.className = armed ? 'fa-solid fa-lock-open' : 'fa-solid fa-lock';
    btnOpenLive.title = armed
      ? 'Safety OFF — Klik untuk mengirim diagram ke mermaid.live'
      : 'Terkunci (Safety ON) — ceklis kunci di sebelah kiri untuk membuka';
  }

  safetyCheck.addEventListener('change', () => {
    const armed = safetyCheck.checked;
    setSafetyArmed(armed);
    if (armed) {
      showToast('🔓 Safety OFF: Tombol mermaid.live siap digunakan');
    } else {
      showToast('🔒 Safety ON: Tombol mermaid.live dikunci');
    }
  });

  btnOpenLive.onclick = () => {
    if (!safetyCheck.checked) return;
    const ok = window.confirm(
      'PERINGATAN KONFIDENSIAL:\nDiagram akan dibuka di situs eksternal mermaid.live.\nLanjutkan?'
    );
    if (!ok) {
      setSafetyArmed(false);
      return;
    }
    const state = {
      code: mermaidCode,
      mermaid: configCode,
      autoSync: autoSync.checked,
      updateDiagram: true,
      panZoom: true,
      grid: rightPane.classList.contains('grid-on')
    };
    const json = JSON.stringify(state);
    const compressed = window.pako.deflate(new TextEncoder().encode(json), { level: 9 });
    let binary = '';
    compressed.forEach(b => binary += String.fromCharCode(b));
    const b64url = btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    window.open(`https://mermaid.live/edit#pako:${b64url}`, '_blank');
    setSafetyArmed(false);
  };

  // Resizable Split Pane
  const splitter = document.getElementById('splitter');
  const leftPane = document.getElementById('left-pane');
  let isDragging = false;

  splitter.addEventListener('mousedown', () => {
    isDragging = true;
    splitter.classList.add('dragging');
    document.body.style.cursor = 'col-resize';
  });
  window.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    const sidebarW = document.getElementById('color-sidebar')?.offsetWidth || 0;
    const newWidth = Math.max(240, Math.min(window.innerWidth * 0.75, e.clientX - sidebarW));
    leftPane.style.width = `${newWidth}px`;
    updateLineNumbers();
    pz?.resize();
    updateAoiOverlayPosition();
  });
  window.addEventListener('mouseup', () => {
    if (!isDragging) return;
    isDragging = false;
    splitter.classList.remove('dragging');
    document.body.style.cursor = '';
  });

  window.addEventListener('resize', () => {
    updateLineNumbers();
    pz?.resize();
    updateAoiOverlayPosition();
  });

  // Initial load (wait for local FontAwesome webfonts so icon widths are measured accurately)
  editor.value = mermaidCode;
  updateLineNumbers();
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => renderDiagram(false));
  } else {
    renderDiagram(false);
  }
</script>
</body>
</html>
